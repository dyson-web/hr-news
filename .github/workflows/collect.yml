name: HR news collect

on:
  schedule:
    # 毎日 7:17 / 10:17 / 13:17 / 16:17 / 19:17 (JST)。cron は UTC 表記
    - cron: "17 1,4,7,10,22 * * *"
  # 設定やコードを変えたときにもすぐ反映（ボットが更新する data/ docs/ では動かない）
  push:
    branches: [main]
    paths: [sources.yaml, collect.py, templates/**, .github/workflows/**]
  workflow_dispatch:
    inputs:
      mode:
        description: "normal / seed（初回：既読登録のみ）/ dry-run"
        default: normal

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect & post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            seed)    python collect.py --seed ;;
            dry-run) python collect.py --dry-run ;;
            *)       python collect.py ;;
          esac

      - name: Commit data & site
        run: |
          git config user.name  "hr-news-bot"
          git config user.email "hr-news-bot@users.noreply.github.com"
          git add data/items.json docs/
          git diff --cached --quiet || git commit -m "update: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
