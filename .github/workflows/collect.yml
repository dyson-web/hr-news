name: HR news collect

on:
  schedule:
    # 平日 8:47 / 17:47 (JST)。cron は UTC 表記
    - cron: "47 23 * * 0-4"
    - cron: "47 8 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal / seed（初回：既読登録のみ）/ dry-run"
        default: normal

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect & post
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            seed)    python collect.py --seed ;;
            dry-run) python collect.py --dry-run ;;
            *)       python collect.py ;;
          esac

      - name: Commit data & site
        run: |
          git config user.name  "hr-news-bot"
          git config user.email "hr-news-bot@users.noreply.github.com"
          git add data/items.json docs/index.html
          git diff --cached --quiet || git commit -m "update: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
