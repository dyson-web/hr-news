<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR News Digest｜人事のニュースと、いま話題の記事</title>
<meta name="description" content="人事系メディアの新着記事を集め、概要・要約と話題度をひと目で。">
<meta name="theme-color" content="#FFFFFF">
<style>
:root {
  --bg: #FFFFFF; --sub-bg: #F5F5F5; --ink: #111111; --ink-2: #4D4D4D; --ink-3: #8C8C8C;
  --line: #E5E5E5; --line-strong: #111111; --focus: #2F7FD8;
  --h0: #D9D9D9; --h1: #F5B400; --h2: #F08A00; --h3: #E5452E; --h4: #C4122F;
  --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121212; --sub-bg: #1E1E1E; --ink: #F2F2F2; --ink-2: #BDBDBD; --ink-3: #8A8A8A; --line: #2A2A2A; --line-strong: #F2F2F2; --h0: #444; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6;
       -webkit-font-smoothing: antialiased; font-feature-settings: "palt"; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── ヘッダー ── */
.top { }
.top-inner { max-width: 1080px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: baseline; gap: 12px; text-decoration: none; flex: none; }
.brand b { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--ink-3); }
.search { flex: 1; max-width: 440px; margin-left: auto; position: relative; }
.search input { width: 100%; height: 38px; padding: 0 36px 0 14px; border-radius: 4px; border: 1px solid var(--line);
                background: var(--sub-bg); font: inherit; font-size: 14px; color: var(--ink); }
.search input:focus { background: var(--bg); border-color: var(--ink-3); }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 12px var(--font);
              color: var(--ink-3); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.search input:focus + kbd, .touch .search kbd { display: none; }

/* ── タブ・絞り込み ── */
.bar { position: sticky; top: 0; z-index: 20; background: var(--bg); transition: box-shadow .2s; }
.bar.stuck { box-shadow: 0 1px 0 var(--line), 0 6px 16px rgb(0 0 0 / .05); }
.bar-inner { max-width: 1080px; margin: 0 auto; padding: 0 20px; }
.savedlink { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border: 0; border-radius: 999px;
             background: none; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--ink); }
.savedlink:hover { background: var(--sub-bg); }
.savedlink[aria-pressed=true] { background: var(--ink); color: var(--bg); }
.savedlink svg { width: 18px; height: 18px; }
.savedlink .n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 11.5px;
                display: inline-grid; place-items: center; font-weight: 700; }
.savedlink .n:empty { display: none; }
.savedlink[aria-pressed=true] .n { background: var(--bg); color: var(--ink); }
.back { border: 0; background: none; padding: 0; margin: 22px 0 0; font-size: 13.5px; color: var(--ink-2); cursor: pointer; display: inline-flex; align-items: center; gap: 2px; }
.back:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.back svg { width: 16px; height: 16px; }
.mode-hot .day:first-of-type, .mode-saved .day:first-of-type { padding-top: 14px; }
.filters { display: flex; gap: 8px; align-items: center; padding: 10px 0 12px; }
.scroller { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; scroll-behavior: smooth; }
.nav { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--sub-bg); color: var(--ink);
       display: grid; place-items: center; cursor: pointer; padding: 0; }
.nav svg { width: 16px; height: 16px; }
.nav:hover:not(:disabled) { background: var(--line); }
.nav:disabled { opacity: .3; cursor: default; }
.chip.topic { border-color: var(--ink); color: var(--ink); font-weight: 700; }
.chip.topic span { margin-left: 6px; color: var(--ink-3); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid transparent; background: var(--sub-bg); padding: 3px 12px; border-radius: 999px;
        font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--ink-2); }
.chip[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 700; }
.sel { flex: none; height: 30px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 4px;
       font: 13px var(--font); padding: 0 6px; max-width: 180px; }
.toggle { flex: none; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.toggle input { accent-color: var(--ink); width: 16px; height: 16px; }
.periods { display: none; gap: 2px; flex: none; background: var(--sub-bg); border-radius: 6px; padding: 2px; }
.periods button { border: 0; background: none; border-radius: 4px; padding: 3px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.periods button[aria-pressed=true] { background: var(--ink); color: var(--bg); font-weight: 700; }
.mode-hot .periods { display: flex; }

/* ── レイアウト ── */
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 80px; }
.side { position: sticky; top: 72px; align-self: start; margin-top: 26px; background: var(--sub-bg); border-radius: 10px; padding: 18px 18px 16px; }
.mode-hot main, .mode-saved main { max-width: 820px; }

/* ── 記事行（白地・罫線区切り・右サムネイル） ── */
/* セクションラベル：小さく薄く、すぐ下のリストに寄せる */
.day, .side h2, .strip h2 { font-size: 16px; font-weight: 700; color: var(--ink-3); letter-spacing: .02em; }
.day { margin: 0; padding: 30px 0 0; display: flex; gap: 10px; align-items: baseline; }
.day span + span { font-size: 12.5px; font-weight: 400; color: var(--ink-3); opacity: .8; }
.day + .list > .row:first-child { padding-top: 10px; }
.dayg + .dayg { margin-top: 16px; }
.list { list-style: none; margin: 0; padding: 0; }
.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; padding: 14px 0;
       cursor: pointer; }
.row:hover .title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.row.active, .row:focus-visible { background: var(--sub-bg); box-shadow: -14px 0 0 var(--sub-bg), 14px 0 0 var(--sub-bg); border-radius: 2px; outline: none; }
.txt { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.title { margin: 0; font-size: 17px; line-height: 1.5; font-weight: 700; letter-spacing: .01em;
         display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.read .title { color: var(--ink-3); }
.digest { margin: 0; font-size: 13.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12px; color: var(--ink-3); }
.meta .src { color: var(--ink-2); font-weight: 700; }
.tag { color: var(--ink-3); }
.tag::before { content: "#"; }
.buzzc { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--ink-2); }
.buzzc i { width: 8px; height: 8px; border-radius: 50%; background: var(--hc, var(--h0)); }
.row[data-heat="1"], .strip li[data-heat="1"] { --hc: var(--h1); } .row[data-heat="2"], .strip li[data-heat="2"] { --hc: var(--h2); }
.row[data-heat="3"], .strip li[data-heat="3"] { --hc: var(--h3); } .row[data-heat="4"], .strip li[data-heat="4"] { --hc: var(--h4); }
.buzzc.hot { color: var(--hc); }
.thumb { width: 120px; height: 80px; border-radius: 6px; overflow: hidden; background: var(--sub-bg); position: relative; align-self: start; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.noimg { display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-3); text-align: center; padding: 6px; line-height: 1.3; }
.save { margin-left: auto; border: 0; background: none; width: 30px; height: 30px; margin-top: -6px; margin-bottom: -6px; border-radius: 4px;
        cursor: pointer; color: var(--ink-3); display: grid; place-items: center; flex: none; }
.save:hover { color: var(--ink); }
.save[aria-pressed=true] { color: var(--ink); }
.save svg { width: 19px; height: 19px; }


/* ── 話題ランキング ── */
.hot .row { grid-template-columns: 44px minmax(0, 1fr) auto; }
.hot .row { padding: 16px 0; }
.hot .rank { font-size: 28px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.hot .rank.top { color: var(--ink); }
.hot .row:nth-child(n+4) .rank { color: var(--ink-3); font-size: 22px; }
.why { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; }
.why b { color: var(--h3); }

/* ── サイド：いま話題 ── */
.side h2 { margin: 0 0 2px;
           display: flex; justify-content: space-between; align-items: baseline; }
.side h2 button { border: 0; background: none; color: var(--ink-2); font-size: 12.5px; cursor: pointer; padding: 0; font-weight: 400; text-decoration: underline; text-underline-offset: 3px; }
.mini { list-style: none; margin: 0; padding: 0; counter-reset: r; }
.mini li { display: grid; grid-template-columns: 24px 1fr 56px; gap: 10px; padding: 11px 0; cursor: pointer; align-items: start; }
.mini li::before { counter-increment: r; content: counter(r); font-weight: 800; font-size: 18px; line-height: 1.2; }
.mini li:nth-child(n+4)::before { color: var(--ink-3); }
.mini .t { font-size: 13.5px; font-weight: 700; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.mini li:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.mini .s { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.mini .mt { width: 56px; height: 56px; border-radius: 6px; object-fit: cover; background: var(--line); }
.legend { margin-top: 10px; padding-top: 12px; box-shadow: 0 -1px 0 var(--line); font-size: 12px; color: var(--ink-3); }
.scale { display: flex; gap: 3px; margin: 6px 0 4px; }
.scale i { flex: 1; height: 4px; border-radius: 2px; }
.scale-l { display: flex; justify-content: space-between; }


/* ── いま話題（トップストーリー型：1件を大きく、続く3件を小さく） ── */
.ts { padding: 28px 0 30px; }
.ts-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.ts-head h2 { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink-3); letter-spacing: .02em; }
.ts-head button { border: 0; background: none; padding: 0; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--ink); display: inline-flex; align-items: center; gap: 2px; }
.ts-head button:hover { text-decoration: underline; text-underline-offset: 3px; }
.ts-head svg { width: 16px; height: 16px; }
.ts-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 36px; cursor: pointer; align-items: start; }
.ts-main h3 { margin: 0 0 12px; font-size: 30px; line-height: 1.4; font-weight: 800; letter-spacing: .01em; }
.ts-main:hover h3 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.ts-why { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--ink-3); margin-bottom: 14px; }
.ts-why .src { color: var(--ink-2); font-weight: 700; }
.ts-why .hot { color: var(--h3); font-weight: 700; }
.ts-lead { margin: 0; font-size: 15px; line-height: 1.85; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.ts-img { aspect-ratio: 1.91; border-radius: 8px; overflow: hidden; background: var(--sub-bg); }
.ts-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ts-img.noimg { display: grid; place-items: center; color: var(--ink-3); font-weight: 700; }
.ts-subs { list-style: none; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.ts-subs li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; cursor: pointer; align-items: start; }
.ts-subs .im { width: 84px; height: 84px; border-radius: 6px; overflow: hidden; background: var(--sub-bg); }
.ts-subs .im.noimg { display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-3); text-align: center; padding: 6px; line-height: 1.3; }
.ts-subs .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ts-subs .t { margin: 0; font-size: 16px; line-height: 1.5; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ts-subs li:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.ts-subs .s { font-size: 12px; color: var(--ink-3); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.ts-subs .s .hot { color: var(--h3); font-weight: 700; }
.ts + .dayg { border-top: 8px solid var(--sub-bg); margin: 0 -9999px; padding: 0 9999px; }
@media (max-width: 860px) {
  .ts { padding: 18px 0 22px; }
  .ts-main { grid-template-columns: 1fr; gap: 14px; }
  .ts-img { order: -1; margin: 0 -16px; border-radius: 0; }
  .ts-main h3 { font-size: 22px; margin-bottom: 8px; }
  .ts-lead { -webkit-line-clamp: 3; font-size: 14.5px; }
  .ts-subs { grid-template-columns: 1fr; gap: 18px; margin-top: 22px; }
  .ts-subs li { grid-template-columns: minmax(0, 1fr) 84px; }
  .ts-subs .im { order: 2; }
  .ts-subs .t { font-size: 15.5px; }
}

/* モバイルの話題ストリップ（旧） */
.strip { display: none; }
@media (max-width: 1000px) {
  .mode-new .strip { display: block; margin: 18px -20px 0; }
  .strip h2 { margin: 0 20px 10px; display: flex; justify-content: space-between; align-items: baseline; }
  .strip h2 button { border: 0; background: none; color: var(--ink-2); font-size: 12.5px; padding: 0; font-weight: 400; text-decoration: underline; }
  .strip ol { list-style: none; margin: 0; padding: 0 20px 6px; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 20px; scrollbar-width: none; counter-reset: r; }
  .strip ol::-webkit-scrollbar { display: none; }
  .strip li { flex: 0 0 62%; scroll-snap-align: start; cursor: pointer; }
  .strip .im { aspect-ratio: 1.91; border-radius: 4px; overflow: hidden; background: var(--sub-bg); position: relative; }
  .strip .im img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .strip .im::after { counter-increment: r; content: counter(r); position: absolute; left: 0; top: 0; background: var(--ink); color: var(--bg);
                      font-weight: 800; font-size: 14px; padding: 2px 9px; border-radius: 0 0 4px 0; }
  .strip .t { font-size: 14px; font-weight: 700; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 6px 0 2px; }
  .strip .s { font-size: 11.5px; color: var(--ink-3); }
}

/* ── 詳細パネル ── */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
         top: 0; right: 0; bottom: 0; width: min(520px, 100vw); transform: translateX(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
         box-shadow: -8px 0 30px rgb(0 0 0 / .15); }
.sheet.on { transform: none; }
@media (max-width: 760px) {
  .sheet { top: auto; left: 0; width: 100%; height: 90dvh; border-radius: 12px 12px 0 0; transform: translateY(100%); box-shadow: 0 -6px 24px rgb(0 0 0 / .18); }
  .grab { display: block !important; }
}
.grab { display: none; width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; gap: 2px; padding: 6px 10px; flex: none; }
.sheet-head .pos { font-size: 12px; color: var(--ink-3); margin-right: auto; padding-left: 8px; }
.icon { border: 0; background: none; width: 40px; height: 40px; border-radius: 4px; display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.icon:hover { background: var(--sub-bg); }
.icon svg { width: 21px; height: 21px; }
.icon:disabled { opacity: .25; cursor: default; }
.sheet-body { overflow-y: auto; padding: 0 0 28px; overscroll-behavior: contain; flex: 1; }
.d-img { aspect-ratio: 1.91; background: var(--sub-bg); overflow: hidden; }
.d-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.d-in { padding: 18px 22px 0; }
.d-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
.d-meta .src { color: var(--ink-2); font-weight: 700; }
.d-title { font-size: 21px; line-height: 1.5; font-weight: 800; margin: 8px 0 10px; }
.d-tags { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.d-tags .tag { font-size: 13px; cursor: pointer; border: 0; background: none; padding: 0; }
.d-tags .tag:hover { color: var(--ink); text-decoration: underline; }
.blk { margin: 0 0 24px; }
.blk h3 { font-size: 15px; font-weight: 800; margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; }
.blk h3 small { font-weight: 400; font-size: 11.5px; color: var(--ink-3); }
.digest-big { font-size: 16px; font-weight: 700; line-height: 1.65; margin: 0 0 24px; padding: 14px 16px; background: var(--sub-bg); border-radius: 8px; }
.points { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.points li { position: relative; padding-left: 16px; line-height: 1.8; }
.points li::before { content: ""; position: absolute; left: 2px; top: .75em; width: 6px; height: 6px; background: var(--ink); }
.desc { margin: 0; color: var(--ink-2); line-height: 1.85; }
.buzz { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.buzz div { padding: 10px 12px; background: var(--sub-bg); border-radius: 8px; }
.buzz b { display: block; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.3; }
.buzz span { font-size: 11.5px; color: var(--ink-3); }
.thermo { display: flex; gap: 3px; margin-top: 10px; }
.thermo i { flex: 1; height: 4px; border-radius: 2px; background: var(--h0); }
.note { font-size: 12.5px; margin: 10px 0 0; }
.note a { color: var(--ink-2); text-underline-offset: 3px; }
.sheet-foot { flex: none; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 16px rgb(0 0 0 / .05); display: flex; gap: 8px; }
.btn { flex: 1; height: 46px; border-radius: 8px; border: 0; background: var(--sub-bg); font-weight: 700; cursor: pointer;
       display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; font-size: 14.5px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); flex: 2; }
.btn[aria-pressed=true] { background: var(--line); }
.btn svg { width: 18px; height: 18px; }

/* ── その他 ── */
.empty { text-align: center; color: var(--ink-2); padding: 60px 10px; }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.more { display: block; margin: 20px auto 0; border: 0; background: var(--sub-bg); border-radius: 999px; padding: 9px 28px; cursor: pointer; font-size: 14px; font-weight: 700; }
footer { max-width: 1080px; margin: 0 auto; padding: 0 20px 60px; font-size: 12.5px; color: var(--ink-3); }
footer details { background: var(--sub-bg); border-radius: 10px; padding: 14px 18px; }
footer summary { cursor: pointer; }
footer table { width: 100%; border-collapse: collapse; margin-top: 8px; }
footer td { padding: 5px 8px 5px 0; vertical-align: top; }
footer a { color: var(--ink-2); }
.err { color: var(--h3); }
.keys { margin-top: 12px; }
.keys kbd { font: 11.5px var(--font); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--ink); color: var(--bg);
         padding: 10px 18px; border-radius: 4px; font-size: 14px; opacity: 0; transition: .2s; z-index: 60; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.skeleton .row { height: 112px; background: linear-gradient(90deg, var(--bg), var(--sub-bg), var(--bg)); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }
@media (max-width: 640px) {
  .top-inner { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
  .brand b { font-size: 20px; }
  .search { max-width: none; flex-basis: 100%; }
  .bar { position: static; }
  .bar-inner, .wrap, footer { padding-left: 16px; padding-right: 16px; }
  .savedlink { margin-left: auto; padding: 0 10px; }
  .search { order: 3; }
  .filters { gap: 6px; }
  .toggle { font-size: 12.5px; gap: 4px; }
  .toggle .long { display: none; }
  .mode-hot .filters { flex-wrap: wrap; }
  .mode-hot .periods { order: -1; }
  .title { font-size: 15.5px; }
  .thumb { width: 84px; height: 84px; }
  .row { column-gap: 12px; padding: 14px 0; }
  .row.active, .row:focus-visible { box-shadow: -16px 0 0 var(--sub-bg), 16px 0 0 var(--sub-bg); }
  .dayg { margin: 0 -16px; padding: 0 16px; }
  .dayg + .dayg { margin-top: 18px; border-top: 8px solid var(--sub-bg); }
  .strip + .dayg { margin-top: 18px; border-top: 8px solid var(--sub-bg); }
  .hot .row { grid-template-columns: 30px minmax(0, 1fr) auto; }
  .hot .rank { font-size: 22px; } .hot .row:nth-child(n+4) .rank { font-size: 18px; }
  .d-in { padding: 16px 18px 0; }
  .d-title { font-size: 19px; }
  .mode-new .strip { margin: 16px -16px 0; }
  .strip h2 { margin: 0 16px 10px; } .strip ol { padding: 0 16px 6px; scroll-padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <a class="brand" href="./"><b>HR News Digest</b><span id="updated">読み込み中…</span></a>
  <label class="search"><span class="sr">記事を検索</span>
    <input id="q" type="search" placeholder="キーワードで探す（例：人的資本、賃上げ、生成AI）" autocomplete="off"><kbd>/</kbd>
  </label>
  <button class="savedlink" data-go="saved" aria-label="保存した記事を見る">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
    <span>保存</span><span class="n" id="savedN"></span>
  </button>
</div></header>

<div class="bar"><div class="bar-inner">
  <div class="filters">
    <div class="periods" role="group" aria-label="期間">
      <button data-p="d1">24時間</button><button data-p="d7">7日間</button><button data-p="d30">30日間</button>
    </div>
    <div class="scroller">
      <button class="nav" id="chipPrev" aria-label="左へ移動"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="chips" id="chips" role="group" aria-label="媒体で絞り込む"></div>
      <button class="nav" id="chipNext" aria-label="右へ移動"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <label class="toggle"><input type="checkbox" id="unread"><span>未読<span class="long">のみ</span></span></label>
  </div>
</div></div>

<div class="wrap">
  <main id="main" aria-live="polite">
    <ul class="list skeleton"><li class="row"></li><li class="row"></li><li class="row"></li><li class="row"></li></ul>
  </main>
</div>

<footer>
  <details><summary>話題度の決め方と収集元</summary>
    <p>話題度は、はてなブックマーク数の伸びと、各メディア公式のアクセスランキング順位から算出しています。記事そのもののPVは公開されていないため、外から見える反応を代わりに使っています。要約はAIが作成したものです。正確な内容は元記事でご確認ください。</p>
    <table id="srcTable"></table>
    <p class="keys">ショートカット：<kbd>/</kbd> 検索　<kbd>J</kbd><kbd>K</kbd> 移動　<kbd>Enter</kbd> 開く　<kbd>O</kbd> 元記事　<kbd>S</kbd> 保存　<kbd>Esc</kbd> 閉じる</p>
  </details>
</footer>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head">
    <span class="pos" id="dPos"></span>
    <button class="icon" id="dPrev" aria-label="前の記事"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="icon" id="dNext" aria-label="次の記事"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="icon" id="dClose" aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sheet-body" id="dBody"></div>
  <div class="sheet-foot">
    <button class="btn" id="dSave"></button>
    <button class="btn" id="dCopy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>コピー</button>
    <a class="btn primary" id="dOpen" target="_blank" rel="noopener">元記事を読む</a>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ICON_SAVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
const ICON_SAVED = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';
const PERIOD_LABEL = { d1: "24時間", d7: "7日間", d30: "30日間" };
const PAGE = 60;
const shortSrc = (s) => s.replace(/（.*?）/g, "").trim();

// ── 端末内の保存（使えない環境でも動くように） ──
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const readSet = new Set(store.get("hrnd.read", []));
const savedList = store.get("hrnd.saved", []);
const savedSet = new Set(savedList);
const persist = () => { store.set("hrnd.read", [...readSet].slice(-3000)); store.set("hrnd.saved", [...savedSet]); };

const S = { mode: "new", period: "d1", topic: null, src: "", q: "", unread: false, limit: PAGE, open: null, list: [] };
let DATA, ITEMS, BY_ID;

// ── 時刻 ──
const now = () => Date.now();
function rel(iso) {
  const t = Date.parse(iso), m = Math.round((now() - t) / 6e4);
  if (m < 60) return `${Math.max(1, m)}分前`;
  if (m < 60 * 24) return `${Math.round(m / 60)}時間前`;
  const d = new Date(t + 9 * 3600e3);
  return `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
}
const jstKey = (ms) => new Date(ms + 9 * 3600e3).toISOString().slice(0, 10);
function dayLabel(key) {
  const [y, m, d] = key.split("-").map(Number);
  const wd = "日月火水木金土"[new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
  const diff = Math.round((Date.parse(jstKey(now())) - Date.parse(key)) / 864e5);
  const base = `${m}月${d}日（${wd}）`;
  return diff === 0 ? `今日　${base}` : diff === 1 ? `昨日　${base}` : base;
}
const dateText = (it) => it.date_unknown ? "日付不明" : (() => { const d = new Date(Date.parse(it.published) + 9 * 3600e3); return `${d.getUTCFullYear()}年${d.getUTCMonth()+1}月${d.getUTCDate()}日`; })();

// ── 絞り込み ──
function matches(it) {
  if (S.topic && !(it.tags || []).includes(S.topic)) return false;
  if (S.src && shortSrc(it.source) !== S.src) return false;
  if (S.unread && readSet.has(it.id)) return false;
  if (S.q) {
    const hay = `${it.title} ${it.digest || ""} ${it.desc || ""} ${(it.summary || []).join(" ")} ${it.source} ${(it.tags || []).join(" ")}`.toLowerCase();
    if (!S.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;
  }
  return true;
}
const isFresh = (it) => it.origin !== "ranking" || (!it.date_unknown && now() - Date.parse(it.published) < 3 * 864e5);
function hotList(period, filtered = true) {
  return ITEMS.filter(it => (it.buzz?.[period] || 0) > 0 && (!filtered || matches(it)))
              .sort((a, b) => b.buzz[period] - a.buzz[period] || Date.parse(b.published) - Date.parse(a.published));
}
function currentList() {
  if (S.mode === "hot") return hotList(S.period);
  if (S.mode === "saved") return savedList.filter(id => savedSet.has(id)).map(id => BY_ID[id]).filter(Boolean).filter(matches).reverse();
  return ITEMS.filter(it => isFresh(it) && matches(it));
}

// ── 描画 ──
function rankName(it) {
  const m = shortSrc(it.rank?.label?.split(" ")[0] || "媒体");
  return m === shortSrc(it.source) ? "アクセス" : `${m} `;
}
function signalText(it, period, short) {
  const s = it.signals?.[period] || {}, out = [];
  if (s.rank) out.push(short ? `${rankName(it)}${s.rank}位` : `${esc(it.rank?.label || "媒体ランキング")} <b>${s.rank}位</b>`);
  if (s.hb) out.push(short ? `はてブ+${s.hb}` : `はてブ <b>+${s.hb}</b>`);
  return out;
}
function thumbHTML(it, cls = "thumb") {
  if (it.image) return `<div class="${cls}"><img src="${esc(it.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noimg');this.parentNode.textContent=this.parentNode.dataset.src||''"></div>`;
  return `<div class="${cls} noimg">${esc(shortSrc(it.source))}</div>`;
}
function buzzHTML(it) {
  const out = [];
  if (it.hb) out.push(`<span class="buzzc${it.heat >= 3 ? " hot" : ""}"><i></i>${it.hb} ブクマ</span>`);
  if (it.rank) out.push(`<span class="buzzc hot"><i></i>${esc(rankName(it))}${it.rank.rank}位</span>`);
  return out.join("");
}
function rowHTML(it, i) {
  const saved = savedSet.has(it.id), hot = S.mode === "hot";
  const tags = (it.tags || []).slice(0, 2).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  return `<li class="row${readSet.has(it.id) ? " read" : ""}" data-id="${it.id}" data-heat="${it.heat || 0}" tabindex="0">
    ${hot ? `<span class="rank${i < 3 ? " top" : ""}">${i + 1}</span>` : ""}
    <div class="txt">
      <h2 class="title">${esc(it.title)}</h2>
      ${it.digest ? `<p class="digest">${esc(it.digest)}</p>` : ""}
      ${hot ? `<div class="why">${signalText(it, S.period).join("")}</div>` : ""}
      <div class="meta"><span class="src">${esc(shortSrc(it.source))}</span><span>${it.date_unknown ? "" : rel(it.published)}</span>${hot ? "" : buzzHTML(it)}${tags}${it.read_min ? `<span>約${it.read_min}分</span>` : ""}<button class="save" aria-pressed="${saved}" aria-label="${saved ? "保存を外す" : "保存する"}" data-save="${it.id}">${saved ? ICON_SAVED : ICON_SAVE}</button></div>
    </div>
    ${thumbHTML(it)}
  </li>`;
}
function render() {
  document.body.className = `mode-${S.mode}${matchMedia("(hover: none)").matches ? " touch" : ""}`;
  $(".savedlink").setAttribute("aria-pressed", S.mode === "saved");
  document.querySelectorAll(".periods button").forEach(b => b.setAttribute("aria-pressed", b.dataset.p === S.period));
  $("#savedN").textContent = savedSet.size ? savedSet.size : "";
  renderChips();
  const list = currentList();
  S.list = list.map(it => it.id);
  const main = $("#main");
  if (!list.length) { main.innerHTML = (S.mode !== "new" ? `<button class="back" data-go="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>新着に戻る</button>` : "") + emptyHTML(); renderSide(); return; }
  let html = "";
  if (S.mode === "new") {
    html += heroHTML();
    let day = "";
    const shown = list.slice(0, S.limit);
    let open = false;
    shown.forEach((it, i) => {
      const k = it.published.slice(0, 10);
      if (k !== day) {
        if (open) html += "</ul></section>";
        const n = list.filter(x => x.published.slice(0, 10) === k).length;
        html += `<section class="dayg"><h2 class="day"><span>${dayLabel(k)}</span><span>${n}件</span></h2><ul class="list">`;
        day = k; open = true;
      }
      html += rowHTML(it, i);
    });
    if (open) html += "</ul></section>";
    if (list.length > S.limit) html += `<button class="more" data-more>さらに表示（残り${list.length - S.limit}件）</button>`;
  } else {
    html += `<button class="back" data-go="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>新着に戻る</button>`;
    if (S.mode === "hot") html += `<h2 class="day"><span>${PERIOD_LABEL[S.period]}でよく読まれている記事</span><span>${list.length}件</span></h2>`;
    else html += `<h2 class="day"><span>保存した記事</span><span>${list.length}件</span></h2>`;
    html += `<ul class="list${S.mode === "hot" ? " hot" : ""}">${list.slice(0, S.mode === "hot" ? 50 : 500).map(rowHTML).join("")}</ul>`;
  }
  main.innerHTML = html;
  if (S.open) main.querySelector(`[data-id="${S.open}"]`)?.classList.add("active");
  renderSide();
}
function emptyHTML() {
  if (S.mode === "saved" && !savedSet.size) return `<div class="empty"><b>保存した記事はまだありません</b>気になる記事のしおりを押すと、ここにまとまります。保存はこの端末のブラウザに残ります。</div>`;
  if (S.mode === "hot" && !hotList(S.period, false).length) return `<div class="empty"><b>${PERIOD_LABEL[S.period]}で話題の記事はまだありません</b>はてなブックマークや各メディアのランキングに動きがあると、ここに並びます。期間を広げてみてください。</div>`;
  return `<div class="empty"><b>条件に合う記事がありません</b><button class="more" data-reset>絞り込みを解除する</button></div>`;
}
function heroHTML() {
  if (S.q || S.topic || S.src || S.unread) return "";
  let p = "d1", list = hotList("d1", false);
  if (list.length < 4) { p = "d7"; list = hotList("d7", false); }
  if (!list.length) return "";
  const [top, ...rest] = list.slice(0, 4);
  const why = (it) => [`<span class="src">${esc(shortSrc(it.source))}</span>`, ...signalText(it, p, true).map(x => `<span class="hot">${esc(x)}</span>`),
                       it.date_unknown ? "" : `<span>${rel(it.published)}</span>`].join("");
  const img = top.image ? `<div class="ts-img"><img src="${esc(top.image)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noimg');this.remove()"></div>`
                        : `<div class="ts-img noimg">${esc(shortSrc(top.source))}</div>`;
  return `<section class="ts" aria-label="いま話題">
    <div class="ts-head"><h2>いま話題</h2><button data-go="hot">ランキングを見る<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
    <article class="ts-main" data-id="${top.id}">
      <div><h3>${esc(top.title)}</h3><div class="ts-why">${why(top)}</div>${top.digest || top.desc ? `<p class="ts-lead">${esc(top.digest || top.desc)}</p>` : ""}</div>
      ${img}
    </article>
    ${rest.length ? `<ol class="ts-subs">${rest.map(it => `<li data-id="${it.id}">
      ${it.image ? `<div class="im"><img src="${esc(it.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"></div>` : `<div class="im noimg">${esc(shortSrc(it.source))}</div>`}
      <div><p class="t">${esc(it.title)}</p><div class="s">${why(it)}</div></div></li>`).join("")}</ol>` : ""}
  </section>`;
}
function renderSide() {}
let MEDIA = [], lastTopic = null;
function renderChips() {
  const el = $("#chips"), keep = S.topic !== lastTopic ? 0 : el.scrollLeft;
  lastTopic = S.topic;
  const topicChip = S.topic ? `<button class="chip topic" data-topic="" aria-label="${esc(S.topic)}の絞り込みを解除">#${esc(S.topic)}<span aria-hidden="true">×</span></button>` : "";
  el.innerHTML = topicChip + `<button class="chip" aria-pressed="${!S.src}" data-src="">すべて</button>` +
    MEDIA.map(m => `<button class="chip" aria-pressed="${S.src === m}" data-src="${esc(m)}">${esc(m)}</button>`).join("");
  el.scrollLeft = keep;
  updateNav();
}
function updateNav() {
  const el = $("#chips"), max = el.scrollWidth - el.clientWidth;
  $("#chipPrev").disabled = el.scrollLeft <= 2;
  $("#chipNext").disabled = el.scrollLeft >= max - 2;
  const hide = max <= 2;
  $("#chipPrev").hidden = hide; $("#chipNext").hidden = hide;
}
$("#chips").addEventListener("scroll", updateNav, { passive: true });
window.addEventListener("resize", updateNav);
$("#chipPrev").onclick = () => $("#chips").scrollBy({ left: -$("#chips").clientWidth * .7 });
$("#chipNext").onclick = () => $("#chips").scrollBy({ left: $("#chips").clientWidth * .7 });

// ── 詳細パネル ──
function openItem(id, push = true) {
  const it = BY_ID[id]; if (!it) return;
  S.open = id;
  readSet.add(id); persist();
  const idx = S.list.indexOf(id);
  const ctx = S.mode === "hot" ? "hot" : "new";
  const sigs = it.signals || {};
  const thermo = [1, 2, 3, 4].map(n => `<i style="${(it.heat || 0) >= n ? `background:var(--h${n})` : ""}"></i>`).join("");
  const summary = (it.summary || []).length
    ? `<div class="blk"><h3>要約<small>AIが作成</small></h3><ul class="points">${it.summary.map(s => `<li>${esc(s)}</li>`).join("")}</ul></div>` : "";
  const desc = it.desc ? `<div class="blk"><h3>概要<small>${esc(it.source)}より</small></h3><p class="desc">${esc(it.desc)}</p></div>` : "";
  const none = !summary && !desc ? `<div class="blk"><p class="desc">この記事には概要がありません。内容は元記事でご確認ください。</p></div>` : "";
  $("#dBody").innerHTML = `
    ${it.image ? `<div class="d-img"><img src="${esc(it.image)}" alt="" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></div>` : ""}
    <div class="d-in">
    <div class="d-meta"><span class="src">${esc(it.source)}</span><span>${dateText(it)}</span>${it.read_min ? `<span>約${it.read_min}分で読めます</span>` : ""}</div>
    <h2 class="d-title" id="dTitle">${esc(it.title)}</h2>
    <div class="d-tags">${(it.tags || []).map(t => `<button class="tag" data-topic="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    ${it.digest ? `<p class="digest-big">${esc(it.digest)}</p>` : ""}
    ${summary}${desc}${none}
    <div class="blk"><h3>話題度</h3>
      <div class="buzz">
        <div><b>${it.hb ?? "—"}</b><span>はてなブックマーク</span></div>
        <div><b>${sigs.d1?.hb ? "+" + sigs.d1.hb : "—"}</b><span>24時間の増加</span></div>
        <div><b>${it.rank ? it.rank.rank + "位" : "—"}</b><span>${it.rank ? esc(it.rank.label) : "媒体ランキング"}</span></div>
      </div>
      <div class="thermo" aria-label="話題度 ${it.heat || 0} / 4">${thermo}</div>
      ${it.hb ? `<p class="note"><a href="https://b.hatena.ne.jp/entry/s/${esc(it.url.replace(/^https?:\/\//, ""))}" target="_blank" rel="noopener">はてなブックマークのコメントを見る</a></p>` : ""}
    </div></div>`;
  $("#dPos").textContent = idx >= 0 ? `${idx + 1} / ${S.list.length}` : "";
  $("#dPrev").disabled = idx <= 0; $("#dNext").disabled = idx < 0 || idx >= S.list.length - 1;
  $("#dOpen").href = it.url;
  setSaveBtn(it.id);
  const sheet = $("#sheet");
  if (sheet.hidden) { sheet.hidden = false; requestAnimationFrame(() => { sheet.classList.add("on"); $("#scrim").classList.add("on"); }); }
  $("#dBody").scrollTop = 0;
  document.querySelectorAll(".row.active").forEach(r => r.classList.remove("active"));
  const row = document.querySelector(`.row[data-id="${id}"]`);
  if (row) { row.classList.add("active", "read"); row.scrollIntoView({ block: "nearest" }); }
  const hash = `#a=${id}`;
  if (push && location.hash !== hash) history[location.hash.startsWith("#a=") ? "replaceState" : "pushState"]({ a: id }, "", hash);
  $("#dClose").focus({ preventScroll: true });
}
function closeItem(fromPop = false) {
  if (!S.open) return;
  const id = S.open; S.open = null;
  $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on");
  setTimeout(() => { if (!S.open) $("#sheet").hidden = true; }, 260);
  if (!fromPop && location.hash.startsWith("#a=")) history.back();
  document.querySelector(`.row[data-id="${id}"]`)?.focus({ preventScroll: true });
  if (S.unread) render();
}
function step(d) {
  const i = S.list.indexOf(S.open) + d;
  if (i >= 0 && i < S.list.length) openItem(S.list[i], false);
}
function setSaveBtn(id) {
  const on = savedSet.has(id);
  $("#dSave").innerHTML = (on ? ICON_SAVED : ICON_SAVE) + (on ? "保存済み" : "保存");
  $("#dSave").setAttribute("aria-pressed", on);
}
function toggleSave(id) {
  if (savedSet.has(id)) { savedSet.delete(id); toast("保存を外しました"); }
  else { savedSet.add(id); savedList.push(id); toast("保存しました"); }
  const i = savedList.indexOf(id); if (!savedSet.has(id) && i >= 0) savedList.splice(i, 1);
  persist();
  if (S.open === id) setSaveBtn(id);
  const keep = S.open; render(); if (keep) document.querySelector(`.row[data-id="${keep}"]`)?.classList.add("active");
}
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1600); }

// ── 操作 ──
document.addEventListener("click", (e) => {
  const t = e.target;
  const save = t.closest("[data-save]"); if (save) { e.stopPropagation(); toggleSave(save.dataset.save); return; }
  const go = t.closest("[data-go]"); if (go) { setMode(go.dataset.go); return; }
  const srcChip = t.closest("[data-src]");
  if (srcChip) { S.src = srcChip.dataset.src; S.limit = PAGE; render(); srcChip.scrollIntoView?.({ block: "nearest", inline: "nearest" }); return; }
  const topic = t.closest("[data-topic]");
  if (topic) { S.topic = topic.dataset.topic || null; S.limit = PAGE; if (S.open) closeItem(); render(); return; }
  if (t.closest("[data-more]")) { S.limit += PAGE * 2; render(); return; }
  if (t.closest("[data-reset]")) { S.topic = null; S.src = ""; S.q = ""; S.unread = false; $("#q").value = ""; $("#unread").checked = false; render(); return; }
  const row = t.closest("[data-id]"); if (row && !t.closest("a")) openItem(row.dataset.id);
});
document.querySelectorAll(".periods button").forEach(b => b.onclick = () => { S.period = b.dataset.p; render(); });
function setMode(m) { if (m === S.mode && m === "saved") m = "new"; S.mode = m; S.limit = PAGE; if (S.open) closeItem(); render(); window.scrollTo({ top: 0 }); }
$("#q").addEventListener("input", (e) => { S.q = e.target.value.trim(); S.limit = PAGE; render(); });
$("#unread").addEventListener("change", (e) => { S.unread = e.target.checked; render(); });
$("#scrim").onclick = () => closeItem();
new IntersectionObserver(([e]) => $(".bar").classList.toggle("stuck", !e.isIntersecting)).observe($(".top"));
$("#dClose").onclick = () => closeItem();
$("#dPrev").onclick = () => step(-1);
$("#dNext").onclick = () => step(1);
$("#dSave").onclick = () => S.open && toggleSave(S.open);
$("#dCopy").onclick = async () => {
  const it = BY_ID[S.open]; if (!it) return;
  const text = `${it.title}\n${it.url}`;
  try { await navigator.clipboard.writeText(text); toast("タイトルとURLをコピーしました"); }
  catch { toast("コピーできませんでした"); }
};
window.addEventListener("popstate", () => {
  const m = location.hash.match(/^#a=(\w+)/);
  if (m) openItem(m[1], false); else closeItem(true);
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, select, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const rows = [...document.querySelectorAll("#main .row")];
  const cur = document.activeElement?.closest?.(".row");
  const k = e.key.toLowerCase();
  if (k === "/") { e.preventDefault(); $("#q").focus(); }
  else if (k === "escape") closeItem();
  else if (S.open && (k === "arrowright" || k === "j")) { e.preventDefault(); step(1); }
  else if (S.open && (k === "arrowleft" || k === "k")) { e.preventDefault(); step(-1); }
  else if (k === "j" || k === "k") {
    e.preventDefault();
    const i = cur ? rows.indexOf(cur) + (k === "j" ? 1 : -1) : 0;
    rows[Math.max(0, Math.min(rows.length - 1, i))]?.focus();
  }
  else if ((k === "enter" || k === " ") && cur) { e.preventDefault(); openItem(cur.dataset.id); }
  else if (k === "o") { const id = S.open || cur?.dataset.id; if (id) { readSet.add(id); persist(); window.open(BY_ID[id].url, "_blank", "noopener"); } }
  else if (k === "s") { const id = S.open || cur?.dataset.id; if (id) toggleSave(id); }
});
// スマホ：シートを下にスワイプで閉じる
(() => {
  let y0 = null;
  const sheet = $("#sheet"), body = $("#dBody");
  sheet.addEventListener("touchstart", (e) => { y0 = (body.scrollTop <= 0 || !body.contains(e.target)) ? e.touches[0].clientY : null; }, { passive: true });
  sheet.addEventListener("touchmove", (e) => {
    if (y0 === null) return;
    const dy = e.touches[0].clientY - y0;
    if (dy > 0 && matchMedia("(max-width: 760px)").matches) sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });
  sheet.addEventListener("touchend", (e) => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0; y0 = null; sheet.style.transform = "";
    if (dy > 110 && matchMedia("(max-width: 760px)").matches) closeItem();
  });
})();

// ── 起動 ──
function renderSources() {
  const f = DATA.features || {};
  $("#srcTable").innerHTML = DATA.sources.map(s => `<tr><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a></td><td>${esc(s.category)}</td>
    <td>${!s.enabled ? "停止中" : s.error ? `<span class="err">${esc(s.error)}</span>` : "取得できています"}</td></tr>`).join("") +
    `<tr><td>はてなブックマーク</td><td>話題度</td><td>${f.hatena_error ? `<span class="err">${esc(f.hatena_error)}</span>` : "取得できています"}</td></tr>` +
    `<tr><td>AI要約</td><td>要約</td><td>${f.ai ? "有効" : "未設定（概要のみ表示）"}</td></tr>`;
}
fetch("data.json?v=__DATA_VERSION__").then(r => r.json()).then(d => {
  DATA = d;
  ITEMS = d.items.slice().sort((a, b) => b.published.localeCompare(a.published));
  BY_ID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
  // 媒体の並び：HRog、日本の人事部を先頭に、残りは設定ファイルの順
  const order = ["HRog", "日本の人事部", ...d.sources.map(x => shortSrc(x.name))];
  const present = new Set(ITEMS.map(i => shortSrc(i.source)));
  MEDIA = [...new Set(order)].filter(m => present.has(m));
  const dt = new Date(Date.parse(d.updated) + 9 * 3600e3);
  $("#updated").textContent = `${dt.getUTCMonth() + 1}月${dt.getUTCDate()}日 ${String(dt.getUTCHours()).padStart(2, "0")}:${String(dt.getUTCMinutes()).padStart(2, "0")} 更新`;
  renderSources();
  render();
  const m = location.hash.match(/^#a=(\w+)/);
  if (m && BY_ID[m[1]]) { history.replaceState(null, "", location.pathname); history.pushState({ a: m[1] }, "", `#a=${m[1]}`); openItem(m[1], false); }
}).catch(() => {
  $("#main").innerHTML = `<div class="empty"><b>記事を読み込めませんでした</b>通信状況を確認して、ページを再読み込みしてください。</div>`;
});
</script>
